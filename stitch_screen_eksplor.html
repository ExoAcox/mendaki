<script>
  // Filter chips active state toggling
  document.querySelectorAll('.filter-chip').forEach(button => {
    button.addEventListener('click', () => {
      document.querySelectorAll('.filter-chip').forEach(btn => {
        btn.classList.remove('bg-primary', 'text-on-primary', 'active');
        btn.classList.add('bg-surface-container', 'text-on-surface');
      });
      button.classList.remove('bg-surface-container', 'text-on-surface');
      button.classList.add('bg-primary', 'text-on-primary', 'active');
    });
  });

  // Favorite bookmark button micro-interaction
  document.querySelectorAll('.favorite-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const icon = btn.querySelector('.material-symbols-outlined');
      const isFilled = icon.style.fontVariationSettings?.includes("'FILL' 1");
      if (isFilled) {
        icon.style.fontVariationSettings = "'FILL' 0";
        icon.classList.remove('text-secondary');
      } else {
        icon.style.fontVariationSettings = "'FILL' 1";
        icon.classList.add('text-secondary');
      }
    });
  });

  // Search input filter preview reaction
  const searchInput = document.getElementById('mountainSearch');
  searchInput?.addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase().trim();
    const articles = document.querySelectorAll('article');
    articles.forEach(article => {
      const title = article.querySelector('h3')?.textContent.toLowerCase() || '';
      const desc = article.querySelector('p')?.textContent.toLowerCase() || '';
      if (!term || title.includes(term) || desc.includes(term)) {
        article.classList.remove('hidden');
      } else {
        article.classList.add('hidden');
      }
    });
  });
